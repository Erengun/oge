name: ci

# The repo is private, so Actions minutes are billed: every job is rounded up
# to the minute, Windows costs 2x and macOS 10x. PRs run one Ubuntu job, main
# runs one race job, and the expensive platforms run only on demand (ADR-0017).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run race, macOS, Windows and the GoReleaser snapshot"
        type: boolean
        default: true

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.1
  GOVULNCHECK_VERSION: v1.8.0
  GORELEASER_VERSION: v2.18.2

jobs:
  # Blocking. The no-cgo job validates ADR-0001's build invariant, cross-builds
  # every release target (Windows included), and checks DCO and the release config.
  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Its own key: setup-go's shared key is saved by whichever job finishes
      # first, so the no-cgo build cache would otherwise never be kept.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: dco
        if: github.event_name == 'pull_request'
        run: scripts/ci-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: scripts/ci-no-live-agents.sh
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: cross-build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/oge
          done
      - run: go test -timeout 30m ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION" ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION" ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  # Race detection needs cgo; testing only, never for release binaries.
  # Runs after merge to main and on demand, not on every PR push.
  race:
    if: github.event_name == 'push' || inputs.full
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/ci-no-live-agents.sh
      - run: go test -race -timeout 30m ./...

  # Runtime behaviour on macOS (10x minutes): on demand only. Development
  # happens on macOS, so local runs cover it between dispatches.
  macos:
    if: inputs.full
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/ci-no-live-agents.sh
      - run: go test -timeout 30m ./...

  # Non-blocking: Windows is cross-build-only for the MVP (ADR-0017). On demand.
  windows:
    if: inputs.full
    runs-on: windows-latest
    continue-on-error: true
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - shell: bash
        run: scripts/ci-no-live-agents.sh
      - run: go test -timeout 30m ./...

  # Builds a release snapshot. Nothing is published. On demand.
  goreleaser:
    if: inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
